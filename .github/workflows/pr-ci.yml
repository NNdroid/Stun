name: PR CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: JNI patches + Android debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout recursively
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/jni/myssh/go.mod
          cache-dependency-path: core/jni/myssh/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up gomobile
        run: |
          # 与 release.yml 同名步骤保持一致：补 -u，引用了不存在的变量直接报错，
          # 而不是悄悄按空串走；顺带让这个块能用普通 bash 在本地复现。
          set -euo pipefail

          # 只认形如 27.0.12077973 的版本号目录。
          # 不能用 `find ... | sort -V | tail -n 1`：那排的是**完整路径**，
          # 而 `$ANDROID_HOME/ndk` 里可能混有非 NDK 目录（实测 Android Studio
          # 装的 `magisk` 就按版本序排在 30.x 之后），会被 tail 选中并让
          # ANDROID_NDK_HOME 指向一个没有 toolchains/ 的路径。
          NDK_VERSION=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d -printf '%f\n' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ -z "$NDK_VERSION" ]; then
            echo "::error::No Android NDK found under $ANDROID_HOME/ndk"
            exit 1
          fi
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          # 选中不等于可用：NDK r19 之前没有 toolchains/，gomobile 会报出
          # 一堆与真实原因无关的错误，这里提前失败并说清是哪一步。
          if [ ! -d "$ANDROID_NDK_HOME/toolchains" ]; then
            echo "::error::$ANDROID_NDK_HOME has no toolchains/ — is it a real NDK?"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "Using Android NDK: $ANDROID_NDK_HOME"

          # gomobile/gobind 必须与 core/jni/myssh/go.mod 里的 x/mobile 同版本：
          # 它们产出的 AAR 布局参与 core 的 compileOnly(classes.jar)，
          # 工具链与库代码版本错配会在无关的后续提交上炸。
          # 版本从 go.mod 读，改依赖时这个 pin 自动跟随。
          XMOBILES=$(awk '/golang.org\/x\/mobile /{print $2; exit}' core/jni/myssh/go.mod)
          if [ -z "$XMOBILES" ]; then
            echo "::error::golang.org/x/mobile not pinned in core/jni/myssh/go.mod"
            exit 1
          fi
          echo "Pinning gomobile/gobind to x/mobile@$XMOBILES (from go.mod)"
          go install "golang.org/x/mobile/cmd/gomobile@$XMOBILES"
          go install "golang.org/x/mobile/cmd/gobind@$XMOBILES"
          gomobile init

      - name: Build myssh compile classes
        working-directory: core/jni/myssh
        run: |
          set -euo pipefail
          mkdir -p ../../libs
          VERSION="v1.0.$(date -u +%Y%m%d)-$(git rev-parse --short=7 HEAD)"
          LDFLAGS="-s -w -X 'myssh.Version=$VERSION' -X 'myssh.DebugStr=false'"
          gomobile bind -target=android -androidapi 28 -ldflags="$LDFLAGS" -trimpath -o ../../libs/myssh.ci.aar .
          rm -rf /tmp/myssh-ci-aar
          mkdir -p /tmp/myssh-ci-aar
          unzip -q ../../libs/myssh.ci.aar classes.jar -d /tmp/myssh-ci-aar
          cp /tmp/myssh-ci-aar/classes.jar ../../libs/myssh-classes.jar
          test -s ../../libs/myssh-classes.jar

      - name: Verify JNI patches from a clean checkout
        run: ./gradlew :core:applyJniPatches --stacktrace --no-daemon

      - name: Test domain sniff parser
        run: |
          cc -Wall -Wextra -Werror \
            -Icore/jni/hev-socks5-tproxy/src \
            core/jni/hev-socks5-tproxy/src/hev-domain-sniff.c \
            core/jni/tests/domain_sniff_test.c \
            -o /tmp/domain-sniff-test
          /tmp/domain-sniff-test

      - name: Unit tests and native debug build
        run: ./gradlew :core:testDebugUnitTest :core:assembleDebug --stacktrace --no-daemon

      # 下面的步骤都不会设置 CI_RUN_NUMBER，所以 build.gradle.kts 走的是本地分支。
      # 这一步唯一的目的：让 CI_RUN_NUMBER>0 那条分支真正执行一遍
      # （git tag --list 'v*' 算 versionCode、git rev-list --count HEAD 算提交数）。
      # 本 job 是 fetch-depth: 1，标签数=0、提交数=1，算出来的值不对没关系 ——
      # 目的是证明这条路径在真实 gradle 环境下不会抛异常、不会破坏配置缓存。
      - name: Smoke-test the CI version path
        env:
          CI_RUN_NUMBER: 1
        run: ./gradlew help --stacktrace --no-daemon

      # 上面只编译 :core —— app / tv / car / wear / xr 的 Kotlin 源码在 PR CI 里从未被
      # 编译过（Gradle 会配置全部模块的 build 脚本，但不会执行它们的任务图），
      # 所以一个编译不过的 app 改动照样能绿。这里补齐，与 release.yml 同源的五个模块都过一遍。
      - name: Compile all app modules
        # 用 run: | 而不是多行 run: —— YAML 纯标量里反斜杠是字面量不是续行符，
        # 那样写出来的实际字符串是 `./gradlew \ :app:assembleDebug ...`。
        run: |
          ./gradlew \
            :app:assembleDebug :tv:assembleDebug :car:assembleDebug \
            :wear:assembleDebug :xr:assembleDebug \
            --stacktrace --no-daemon --parallel
