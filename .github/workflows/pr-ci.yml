name: PR CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: JNI patches + Android debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout recursively
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify JNI patches from a clean checkout
        run: ./gradlew :core:applyJniPatches --stacktrace --no-daemon

      - name: Unit tests and native debug build
        run: ./gradlew :core:testDebugUnitTest :core:assembleDebug --stacktrace --no-daemon
