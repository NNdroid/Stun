name: Android Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_module:
        description: '🏗️ 选择构建模块'
        required: true
        type: choice
        options:
          - 'all'
          - 'app'
          - 'tv'
          - 'car'
          - 'wear'
          - 'xr'
        default: 'all'
      build_variant:
        description: '🚀 构建类型 (Variant)'
        required: true
        type: choice
        options:
          - 'release'
          - 'debug'
          - 'both'
        default: 'release'
      build_aab:
        description: '📦 生成 App Bundle (AAB)'
        required: true
        type: boolean
        default: false
      sign_release:
        description: '✍️ 对 Release 进行签名'
        required: true
        type: boolean
        default: true
      clean_build:
        description: '🧹 执行 Clean 构建'
        required: true
        type: boolean
        default: false
      auto_release:
        description: '🚀 构建成功后自动创建 release tag 并发布 GitHub Release（须填下方版本号）'
        required: true
        type: boolean
        default: false
      version:
        description: '🔢 自定义版本号，如 1.13（留空 = 自动 v1.0.<UTC日期>.<提交数>-<哈希>）'
        required: false
        type: string
        default: ''
      custom_tag:
        description: '🏷️ 产物命名称后缀 (可选)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          # 必须全量：自动版本号用 `git tag --list 'v*'` 算 versionCode、
          # `git rev-list --count HEAD` 算 versionName 里的提交数。默认的 fetch-depth: 1
          # 是浅克隆，tag 拿不到、提交数算成 1，versionCode 会永远卡在 15。
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 从 go.mod 读版本，不硬编码：`go 1.26.1` 的 go.mod 用 Go 1.23 工具链会直接
          # 报 "go.mod requires go >= 1.26.1" 而编译失败。升 go.mod 时这里自动跟随。
          go-version-file: 'core/jni/myssh/go.mod'
          cache-dependency-path: 'core/jni/myssh/go.sum'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android NDK & gomobile
        run: |
          # 只认形如 27.0.12077973 的版本号目录。
          # 不能用 `find ... | sort -V | tail -n 1`：那排的是**完整路径**，
          # 而 `$ANDROID_HOME/ndk` 里可能混有非 NDK 目录（实测 Android Studio
          # 装的 `magisk` 就按版本序排在 30.x 之后），会被 tail 选中并让
          # ANDROID_NDK_HOME 指向一个没有 toolchains/ 的路径 —— 发版流程会
          # 在一个与代码无关的地方失败，且错误信息完全不提 NDK 选择。
          NDK_VERSION=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d -printf '%f\n' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ -z "$NDK_VERSION" ]; then
            echo "::error::No Android NDK found under $ANDROID_HOME/ndk"
            exit 1
          fi
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          # 选中不等于可用：NDK r19 之前没有 toolchains/，gomobile 会报出
          # 一堆与真实原因无关的错误，这里提前失败并说清是哪一步。
          if [ ! -d "$ANDROID_NDK_HOME/toolchains" ]; then
            echo "::error::$ANDROID_NDK_HOME has no toolchains/ — is it a real NDK?"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "Using Android NDK: $ANDROID_NDK_HOME"

          # gomobile/gobind 必须与 core/jni/myssh/go.mod 里的 x/mobile 同版本：
          # 产出的 AAR 布局要跟 core 的 compileOnly(classes.jar) 对得上。
          # 发版尤其不能飘 —— @latest 换个版本就可能改变 AAR 结构，
          # 让你在发出去的包上才发现问题。版本从 go.mod 读，自动跟随。
          XMOBILES=$(awk '/golang.org\/x\/mobile /{print $2; exit}' core/jni/myssh/go.mod)
          if [ -z "$XMOBILES" ]; then
            echo "::error::golang.org/x/mobile not pinned in core/jni/myssh/go.mod"
            exit 1
          fi
          echo "Pinning gomobile/gobind to x/mobile@$XMOBILES (from go.mod)"
          go install "golang.org/x/mobile/cmd/gomobile@$XMOBILES"
          go install "golang.org/x/mobile/cmd/gobind@$XMOBILES"
          gomobile init

      - name: Build myssh AAR from core/jni/myssh
        working-directory: core/jni/myssh
        run: |
          mkdir -p ../../libs
          # 与 core/jni/myssh/scripts/build_android_libs.sh 保持一致：v1.0.YYYYMMDD-<myssh 提交短哈希>
          VERSION="v1.0.$(date -u +%Y%m%d)-$(git rev-parse --short=7 HEAD)"

          echo "📦 Compiling myssh.release.aar..."
          LDFLAGS="-s -w -X 'myssh.Version=$VERSION' -X 'myssh.DebugStr=false'"
          gomobile bind -v -target=android -androidapi 28 -ldflags="$LDFLAGS" -trimpath -o "../../libs/myssh.release.aar" .
          
          echo "📦 Compiling myssh.debug.aar..."
          LDFLAGS="-X 'myssh.Version=$VERSION' -X 'myssh.DebugStr=true'"
          gomobile bind -v -target=android -androidapi 28 -ldflags="$LDFLAGS" -o "../../libs/myssh.debug.aar" .

      # 各模块的构建脚本只认 core/libs/ 里的两个产物（该目录被 gitignore，本机用
      # core/jni/myssh/scripts/build_android_libs.sh 生成、CI 必须现场复刻，否则
      # files(...) 声明的路径不存在，构建直接失败）：
      #   myssh-classes.jar   —— 编译期 classes（release/debug 的 gomobile 绑定类相同，共享一份）
      #   myssh.*-slim.aar    —— 运行期 AAR：原包去掉 classes.jar（避免与上面的 jar duplicate-class），
      #                          jni/*.so 等其余条目原样保留
      - name: Extract myssh classes.jar & build slim AARs
        working-directory: core/libs
        run: |
          set -e
          for VARIANT in release debug; do
            AAR="myssh.${VARIANT}.aar"
            WORK="work_${VARIANT}"
            unzip -o -q "$AAR" -d "$WORK"
            if [ "$VARIANT" = "release" ]; then
              cp "$WORK/classes.jar" myssh-classes.jar
            fi
            rm "$WORK/classes.jar"
            (cd "$WORK" && zip -q -r "../myssh.${VARIANT}-slim.aar" .)
            rm -rf "$WORK"
          done
          echo "📦 Slim artifacts ready:"
          ls -la myssh-classes.jar myssh.release-slim.aar myssh.debug-slim.aar

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache NDK build outputs
        uses: actions/cache@v4
        with:
          path: |
            core/build/intermediates/cxx
            core/.cxx
          key: ndk-${{ runner.os }}-${{ hashFiles('core/jni/**') }}
          restore-keys: |
            ndk-${{ runner.os }}-

      - name: Set Build Options
        id: options
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "build_module=${{ github.event.inputs.build_module }}" >> $GITHUB_OUTPUT
            echo "build_variant=${{ github.event.inputs.build_variant }}" >> $GITHUB_OUTPUT
            echo "build_aab=${{ github.event.inputs.build_aab }}" >> $GITHUB_OUTPUT
            echo "sign=${{ github.event.inputs.sign_release }}" >> $GITHUB_OUTPUT
            echo "clean=${{ github.event.inputs.clean_build }}" >> $GITHUB_OUTPUT

            # 用户输入先净化再落进 $GITHUB_OUTPUT：这些值后面会进 shell 命令，
            # 若原样拼进去，填个 `1.13; rm -rf /` 就会在 shell 里被当成命令执行。
            RAW_VERSION="${{ github.event.inputs.version }}"
            RAW_TAG="${{ github.event.inputs.custom_tag }}"
            AUTO_RELEASE="${{ github.event.inputs.auto_release }}"
            AUTO_RELEASE=${AUTO_RELEASE:-false}
            RAW_VERSION=${RAW_VERSION//[!0-9A-Za-z._+-]/}
            RAW_TAG=${RAW_TAG//[!0-9A-Za-z._+-]/}
            echo "auto_release=$AUTO_RELEASE" >> $GITHUB_OUTPUT
            echo "version=$RAW_VERSION" >> $GITHUB_OUTPUT

            # 自动发版：tag 名由版本号派生（1.13 → v1.13）。必须在**构建之前**校验 ——
            # 否则跑完十几分钟才在打 tag 那一步失败，白烧一次 runner。
            if [ "$AUTO_RELEASE" == "true" ]; then
              if [ -z "$RAW_VERSION" ]; then
                echo "::error::勾选了自动创建 Release，但没有填版本号"
                exit 1
              fi
              TAG="v${RAW_VERSION#v}"
              if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+(\.[0-9]+){0,2}(-[0-9A-Za-z.-]+)?$'; then
                echo "::error::版本号非法（应为 1.13 / 1.13.0 / 1.13-beta 这类）：${{ github.event.inputs.version }}"
                exit 1
              fi
              echo "release_tag=$TAG" >> $GITHUB_OUTPUT
            else
              echo "release_tag=" >> $GITHUB_OUTPUT
            fi
            echo "tag=$RAW_TAG" >> $GITHUB_OUTPUT
          else
            # 自动触发时（Release 发布）全量构建所有端；AAB 必须构建 —— 它是本 run 的 artifact
            echo "build_module=all" >> $GITHUB_OUTPUT
            echo "build_variant=both" >> $GITHUB_OUTPUT
            echo "build_aab=true" >> $GITHUB_OUTPUT
            echo "sign=true" >> $GITHUB_OUTPUT
            echo "clean=false" >> $GITHUB_OUTPUT
            # release 事件本身已经带着 tag 和 GitHub Release，不再重复创建；
            # versionName 沿用自动值，不做覆盖。
            echo "auto_release=false" >> $GITHUB_OUTPUT
            echo "version=" >> $GITHUB_OUTPUT
            echo "release_tag=" >> $GITHUB_OUTPUT
            echo "tag=" >> $GITHUB_OUTPUT
          fi

      - name: Decode Keystore
        if: steps.options.outputs.sign == 'true'
        id: decode_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: 'keystore.jks'
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Sign APK & AAB
        env:
          # 正整数即触发 CI 自动版本：versionCode = 万位段 + 13 + v* 标签数 + 1；
          # versionName = v1.0.<UTC 日期>.<提交数>-<短哈希>。pr-ci 不设该变量，走手工版本。
          CI_RUN_NUMBER: ${{ github.run_number }}
          # 「版本号」输入，原样写入 versionName；空串 = 用自动值（见 build.gradle.kts）。
          # versionCode 不受它影响，仍按 v* tag 数递增。
          CI_VERSION_NAME: ${{ steps.options.outputs.version }}
          KEYSTORE_FILE: ${{ steps.decode_keystore.outputs.filePath }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          MODULE_CHOICE="${{ steps.options.outputs.build_module }}"
          case "$MODULE_CHOICE" in
            app)  MODULES="app" ;;
            tv)   MODULES="tv" ;;
            car)  MODULES="car" ;;
            wear) MODULES="wear" ;;
            xr)   MODULES="xr" ;;
            *)    MODULES="app tv car wear xr" ;;
          esac

          TASKS=""
          if [ "${{ steps.options.outputs.clean }}" == "true" ]; then
            TASKS="clean"
          fi

          VARIANT="${{ steps.options.outputs.build_variant }}"
          
          for mod in $MODULES; do
            # Build APKs
            if [ "$VARIANT" == "release" ] || [ "$VARIANT" == "both" ]; then
              TASKS="$TASKS :$mod:assembleRelease"
              if [ "${{ steps.options.outputs.build_aab }}" == "true" ]; then
                TASKS="$TASKS :$mod:bundleRelease"
              fi
            fi
            if [ "$VARIANT" == "debug" ] || [ "$VARIANT" == "both" ]; then
              TASKS="$TASKS :$mod:assembleDebug"
            fi
          done
          
          if [ -z "$TASKS" ] || [ "$TASKS" == "clean" ]; then
            echo "⚠️ No build tasks selected. Skipping Gradle build."
            exit 0
          fi

          echo "🚀 Running tasks: $TASKS"

          PARAMS=""
          if [ "${{ steps.options.outputs.sign }}" == "true" ]; then
            PARAMS="-Pandroid.injected.signing.store.file=$KEYSTORE_FILE \
                    -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
                    -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
                    -Pandroid.injected.signing.key.password=$KEY_PASSWORD"
          fi

          ./gradlew $TASKS $PARAMS

      - name: Generate Build Summary
        if: always()
        run: |
          echo "## 🚀 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Module:** ${{ steps.options.outputs.build_module }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Variant:** ${{ steps.options.outputs.build_variant }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Sign:** ${{ steps.options.outputs.sign }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Clean Build:** ${{ steps.options.outputs.clean }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.options.outputs.version }}" ]; then
            echo "- **Version:** \`${{ steps.options.outputs.version }}\`（自定义，原样写入 versionName）" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.options.outputs.auto_release }}" == "true" ]; then
            echo "- **Auto Release:** \`${{ steps.options.outputs.release_tag }}\`" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "${{ steps.options.outputs.tag }}" ]; then
            echo "- **Custom Tag:** ${{ steps.options.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts generated:" >> $GITHUB_STEP_SUMMARY
          find . -name "*.apk" -o -name "*.aab" | grep "/build/outputs/" | sed 's/.*\//- /' >> $GITHUB_STEP_SUMMARY

      # tag（release 发布）触发：AAB bundle 挂到本 Action Run 的 artifact；
      # APK 与 AAR 才是 Release 页面的资产（见下面 Upload Release Assets）。
      # release 事件固定 build_variant=both + build_aab=true，bundle 必然存在
      - name: Upload AAB Bundles to Action Run (tag build)
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: aab-bundles-${{ github.event.release.tag_name }}
          path: |
            app/build/outputs/bundle/**/*.aab
            tv/build/outputs/bundle/**/*.aab
            car/build/outputs/bundle/**/*.aab
            wear/build/outputs/bundle/**/*.aab
            xr/build/outputs/bundle/**/*.aab
          if-no-files-found: error

      # 手动触发（workflow_dispatch）：全量产物照旧挂在本 run 上
      - name: Upload Build Artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Stun-Build-${{ steps.options.outputs.tag || 'Artifacts' }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
            tv/build/outputs/apk/**/*.apk
            tv/build/outputs/bundle/**/*.aab
            car/build/outputs/apk/**/*.apk
            car/build/outputs/bundle/**/*.aab
            wear/build/outputs/apk/**/*.apk
            wear/build/outputs/bundle/**/*.aab
            xr/build/outputs/apk/**/*.apk
            xr/build/outputs/bundle/**/*.aab
            core/libs/*.aar
          if-no-files-found: warn

      # workflow_dispatch + 自动发版：在 HEAD 上打 tag 并发布 GitHub Release。
      # tag 故意放在**构建之后**：versionCode 按 `v* tag 数 + 1` 算（见 build.gradle.kts），
      # 那个 +1 指的就是「本次将要创建的 tag」。若先打 tag 再构建，计数会多 1、versionCode 虚高。
      - name: Create Release Tag & Publish Release
        if: github.event_name == 'workflow_dispatch' && steps.options.outputs.auto_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.options.outputs.release_tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::远端已存在 tag $TAG —— 换个版本号重跑，或删除该 tag"
            exit 1
          fi

          # 与 tag 触发的 Upload Release Assets 同一套资产口径：APK（有哪个收哪个）+ myssh AAR。
          # AAB 只挂 run artifact，不上 Release 页。
          FILES=()
          for MOD in app tv car wear xr; do
            for VARIANT in release debug; do
              for f in "$MOD"/build/outputs/apk/$VARIANT/*.apk; do
                [ -f "$f" ] && FILES+=("$f")
              done
            done
          done
          for AAR in core/libs/myssh.release.aar core/libs/myssh.debug.aar; do
            [ -f "$AAR" ] && FILES+=("$AAR")
          done
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::没有任何可上传的 APK/AAR，取消创建 Release（tag 未创建）"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"

          # tag 一旦推到远端，versionCode 计数就变了。所以 gh release create 失败必须回滚，
          # 否则会留下一个「没有 Release 的 tag」：既顶高了下次发版的 versionCode，
          # 又让重跑同名版本直接失败。
          trap 'echo "::warning::gh release create 失败，回滚远端 tag $TAG";
                git push origin ":refs/tags/$TAG" >/dev/null 2>&1 || true;
                git tag -d "$TAG" >/dev/null 2>&1 || true' ERR

          git push origin "$TAG"
          echo "📦 Uploading ${#FILES[@]} assets to $TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes "${FILES[@]}"
          trap - ERR

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            tv/build/outputs/apk/release/*.apk
            car/build/outputs/apk/release/*.apk
            wear/build/outputs/apk/release/*.apk
            xr/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            tv/build/outputs/apk/debug/*.apk
            car/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
            xr/build/outputs/apk/debug/*.apk
            core/libs/myssh.release.aar
            core/libs/myssh.debug.aar
          fail_on_unmatched_files: false
